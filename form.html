<!doctype html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="./css/reset.css" />
        <link rel="stylesheet" href="./css/style.css" />
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Register</title>
    </head>
    <body id="register-body">
        <form action="" class="form-register" autocomplete="off" spellcheck="false">
            <h1 id="form-header">REGISTER</h1>
            <div class="form-group">
                <label for="name" class="label-form">Display Name</label>
                <input type="text" id="name" placeholder="Name..." required/>
                <label for="email" class="label-form">Email</label>
                <input type="email" id="email" placeholder="Email..." required/>
                <label for="phone-number" class="label-form">Phone Number</label>
                <input type="tel" id="phone-number" placeholder="Phone number..." required/>
                <label for="password" class="label-form">Password</label>
                <input type="password" id="password" placeholder="Password..." required/>
                <label for="confirm-password" class="label-form">Confirm Password</label>
                <input type="password" id="confirm-password" placeholder="Confirm Password..." required/>
            </div>
            <div class="form-group">
                <label class="label-form">Gender</label>
                <label for="male">Male</label>
                <input type="radio" name="gender" id="male" required/>
                <label for="female">Female</label>
                <input type="radio" name="gender" id="female" required/>
                <label for="other">Other</label>
                <input type="radio" name="gender" id="other" required/>
            </div>

            <div class="form-group">
                <label for="date-of-birth" class="label-form">Date of Birth</label>
                <input type="date" name="" id="date-of-birth" required/>
            </div>
            <div class="form-group">
                <label for="address" class="label-form">Address</label>
                <input type="text" id="address" placeholder="Address..." required/>
            </div>

            </div>
            <div class="form-group">
                <label for="" class="label-form">Communication Preferences</label>
                <label class="label-form">
                    <input type="checkbox" value="gender" />
                    Subscribe to Newsletter
                </label>
                <label class="label-form">
                    <input type="checkbox" value="gender" />
                    Receive Promotional Emails
                </label>
                <label class="label-form">
                    <input type="checkbox" value="gender" />
                    Get Product Updates
                </label>
                <button type="submit" class="btn">Register</button>
            </div>
        </form>
